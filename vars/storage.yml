# Extra disks, formatted by hand as xfs with these labels. Mounted by label,
# so no hardware IDs land in the repo; nofail keeps boot working without them.
# 4 TB HDD: backup-hdd is a plain partition; frigate and media are LVs in
# volume group "data", with unallocated space left to grow either online.
storage_mounts:
  - label: backup-hdd
    path: /mnt/backup-hdd
  - label: backup-usb
    path: /mnt/backup-usb
  - label: frigate
    path: /mnt/frigate
  - label: media
    path: /mnt/media

# Movies and shows, read by both Plex and Jellyfin
media_path: /mnt/media

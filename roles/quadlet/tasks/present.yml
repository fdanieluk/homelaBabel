- name: Ensure {{ quadlet_name }} data directories exist
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ quadlet_dirs }}"

- name: Ensure quadlet directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/containers/systemd"
    state: directory
    mode: "0700"

- name: Template {{ quadlet_name }} quadlet unit
  ansible.builtin.template:
    src: "{{ quadlet_template }}"
    dest: "{{ ansible_env.HOME }}/.config/containers/systemd/{{ quadlet_name }}.container"
    mode: "0644"
  register: quadlet_unit

- name: Reload systemd user daemon
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when: quadlet_unit.changed

# Fail here with a readable error rather than in a slow unit start
- name: Pull {{ quadlet_name }} image
  ansible.builtin.command:
    cmd: podman pull {{ quadlet_image }}
  when: quadlet_unit.changed

- name: Restart {{ quadlet_name }}
  ansible.builtin.systemd:
    name: "{{ quadlet_name }}"
    state: restarted
    scope: user
  when: quadlet_unit.changed or quadlet_restart | bool

- name: Ensure {{ quadlet_name }} is running
  ansible.builtin.systemd:
    name: "{{ quadlet_name }}"
    state: started
    scope: user

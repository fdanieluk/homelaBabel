- name: Deploy Matter server
  hosts: all
  become: false
  vars_files:
    - ../vars/matter-server.yml

  tasks:
    - name: Deploy as user service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      block:
        - name: Ensure data directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/matter-server"
            state: directory
            mode: "0755"

        - name: Ensure quadlet directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/containers/systemd"
            state: directory
            mode: "0700"

        - name: Template quadlet unit
          ansible.builtin.template:
            src: ../templates/matter-server.container.j2
            dest: "{{ ansible_env.HOME }}/.config/containers/systemd/matter-server.container"
            mode: "0644"
          register: quadlet_changed

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user
          when: quadlet_changed.changed

        - name: Pull image
          ansible.builtin.command:
            cmd: podman pull {{ matter_server_image }}
          when: quadlet_changed.changed

        - name: Restart Matter server
          ansible.builtin.systemd:
            name: matter-server
            state: restarted
            scope: user
          when: quadlet_changed.changed

        - name: Ensure Matter server is running
          ansible.builtin.systemd:
            name: matter-server
            state: started
            scope: user

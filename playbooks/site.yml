# Deploys all user services; host setup (sudo) stays in setup.yml
- name: Home Assistant
  ansible.builtin.import_playbook: deploy-homeassistant.yml

- name: Matter server
  ansible.builtin.import_playbook: deploy-matter-server.yml

- name: Pi-hole
  ansible.builtin.import_playbook: deploy-pihole.yml

- name: Mosquitto
  ansible.builtin.import_playbook: deploy-mosquitto.yml

- name: Glances
  ansible.builtin.import_playbook: deploy-glances.yml

- name: Frigate
  ansible.builtin.import_playbook: deploy-frigate.yml

- name: Plex
  ansible.builtin.import_playbook: deploy-plex.yml

- name: Jellyfin
  ansible.builtin.import_playbook: deploy-jellyfin.yml

- name: Backup
  ansible.builtin.import_playbook: deploy-backup.yml

- name: Podman auto-update schedule
  hosts: all
  become: false
  roles:
    - podman_auto_update

# Deploys all user services; host setup (sudo) stays in setup.yml
- name: Home Assistant
  ansible.builtin.import_playbook: deploy-homeassistant.yml

- name: Matter server
  ansible.builtin.import_playbook: deploy-matter-server.yml

- name: Pi-hole
  ansible.builtin.import_playbook: deploy-pihole.yml

# Replaced by the Mobilus integration in Home Assistant; drop this play
# once it has run on babel. Data in ~/electric-eye is left in place.
- name: Retire electric-eye
  hosts: all
  become: false
  roles:
    - role: quadlet
      quadlet_name: electric-eye
      quadlet_state: absent

- name: Podman auto-update schedule
  hosts: all
  become: false
  roles:
    - podman_auto_update

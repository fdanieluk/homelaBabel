- name: Deploy Home Assistant
  hosts: all
  become: false
  vars_files:
    - ../vars/homeassistant.yml
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"

  tasks:
    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/homeassistant"
        state: directory
        mode: "0755"

    - name: Ensure quadlet directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/containers/systemd"
        state: directory
        mode: "0700"

    - name: Template quadlet unit
      ansible.builtin.template:
        src: ../templates/homeassistant.container.j2
        dest: "{{ ansible_env.HOME }}/.config/containers/systemd/homeassistant.container"
        mode: "0644"
      register: quadlet_changed

    - name: Reload systemd user daemon
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      when: quadlet_changed.changed

    - name: Pull image
      ansible.builtin.command:
        cmd: podman pull {{ homeassistant_image }}
      when: quadlet_changed.changed

    - name: Restart Home Assistant
      ansible.builtin.systemd:
        name: homeassistant
        state: restarted
        scope: user
      when: quadlet_changed.changed

    - name: Ensure Home Assistant is running
      ansible.builtin.systemd:
        name: homeassistant
        state: started
        scope: user

- name: Deploy Home Assistant
  hosts: all
  become: false
  vars_files:
    - ../vars/homeassistant.yml

  tasks:
    - name: Deploy as user service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      block:
        - name: Ensure config directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/homeassistant"
            state: directory
            mode: "0755"

        - name: Ensure HACS directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs"
            state: directory
            mode: "0755"

        # Bootstrap only: once present, HACS updates itself from the HA UI
        - name: Download HACS if missing
          ansible.builtin.unarchive:
            src: "https://github.com/hacs/integration/releases/download/{{ hacs_version }}/hacs.zip"
            dest: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs"
            remote_src: true
            creates: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs/manifest.json"
          register: hacs_installed

        - name: Ensure quadlet directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/containers/systemd"
            state: directory
            mode: "0700"

        - name: Template quadlet unit
          ansible.builtin.template:
            src: ../templates/homeassistant.container.j2
            dest: "{{ ansible_env.HOME }}/.config/containers/systemd/homeassistant.container"
            mode: "0644"
          register: quadlet_changed

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user
          when: quadlet_changed.changed

        - name: Pull image
          ansible.builtin.command:
            cmd: podman pull {{ homeassistant_image }}
          when: quadlet_changed.changed

        - name: Restart Home Assistant
          ansible.builtin.systemd:
            name: homeassistant
            state: restarted
            scope: user
          when: quadlet_changed.changed or hacs_installed.changed

        - name: Ensure Home Assistant is running
          ansible.builtin.systemd:
            name: homeassistant
            state: started
            scope: user

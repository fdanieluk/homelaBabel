- name: Deploy Home Assistant
  hosts: all
  become: false
  vars_files:
    - ../vars/homeassistant.yml

  tasks:
    - name: Ensure HACS directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs"
        state: directory
        mode: "0755"

    # Bootstrap only: once present, HACS updates itself from the HA UI
    - name: Download HACS if missing
      ansible.builtin.unarchive:
        src: "https://github.com/hacs/integration/releases/download/{{ hacs_version }}/hacs.zip"
        dest: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs"
        remote_src: true
        creates: "{{ ansible_env.HOME }}/homeassistant/custom_components/hacs/manifest.json"
      register: hacs_installed

    - name: Deploy Home Assistant quadlet
      ansible.builtin.include_role:
        name: quadlet
      vars:
        quadlet_name: homeassistant
        quadlet_image: "{{ homeassistant_image }}"
        quadlet_dirs:
          - path: homeassistant
            mode: "0755"
        quadlet_restart: "{{ hacs_installed.changed }}"

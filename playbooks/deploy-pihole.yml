- name: Deploy Pi-hole
  hosts: all
  become: false
  vars_files:
    - ../vars/pihole.yml

  tasks:
    - name: Deploy as user service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      block:
        - name: Ensure data directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/pihole"
            state: directory

        - name: Ensure quadlet directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/containers/systemd"
            state: directory
            mode: "0700"

        - name: Template quadlet unit
          ansible.builtin.template:
            src: ../templates/pihole.container.j2
            dest: "{{ ansible_env.HOME }}/.config/containers/systemd/pihole.container"
            mode: "0644"
          register: quadlet_changed

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user
          when: quadlet_changed.changed

        - name: Pull image
          ansible.builtin.command:
            cmd: podman pull {{ pihole_image }}
          when: quadlet_changed.changed

        - name: Restart Pi-hole
          ansible.builtin.systemd:
            name: pihole
            state: restarted
            scope: user
          when: quadlet_changed.changed

        - name: Ensure Pi-hole is running
          ansible.builtin.systemd:
            name: pihole
            state: started
            scope: user

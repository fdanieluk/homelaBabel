- name: Base server setup
  hosts: all
  tasks:
    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - git
          - python3
          - podman
          - podman-compose
          - htop
          - vim
          - nano
        state: present

    - name: Install avahi (mDNS)
      ansible.builtin.dnf:
        name: avahi
        state: present

    - name: Enable and start avahi-daemon
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: started
        enabled: true

    - name: Open mDNS in firewalld
      ansible.posix.firewalld:
        service: mdns
        permanent: true
        immediate: true
        state: enabled
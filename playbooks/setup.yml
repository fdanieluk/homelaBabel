- name: Base server setup
  hosts: all
  tasks:
    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - git
          - python3
          - podman
          - podman-compose
          - htop
          - vim
          - nano
        state: present

    - name: Install avahi (mDNS)
      ansible.builtin.dnf:
        name: avahi
        state: present

    - name: Enable and start avahi-daemon
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: started
        enabled: true

    - name: Open mDNS in firewalld
      ansible.posix.firewalld:
        service: mdns
        permanent: true
        immediate: true
        state: enabled

    - name: Open Home Assistant port in firewalld
      ansible.posix.firewalld:
        port: 8123/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Enable linger so user services start at boot
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ lookup('env', 'USER') }}
        creates: /var/lib/systemd/linger/{{ lookup('env', 'USER') }}
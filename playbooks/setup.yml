- name: Base server setup
  hosts: all
  vars:
    # babel resolves via public DNS, never via its own Pi-hole
    host_dns: "1.1.1.1,9.9.9.9"
    lan_subnet: 192.168.68.0/22
  tasks:
    - name: Install base packages
      ansible.builtin.dnf:
        name:
          - git
          - python3
          - podman
          - htop
          - vim
          - nano
          - unzip
        state: present

    # Services run as Quadlets now; nothing uses compose
    - name: Remove unused packages
      ansible.builtin.dnf:
        name:
          - podman-compose
        state: absent

    - name: Install avahi (mDNS)
      ansible.builtin.dnf:
        name: avahi
        state: present

    - name: Enable and start avahi-daemon
      ansible.builtin.systemd_service:
        name: avahi-daemon
        state: started
        enabled: true

    - name: Open mDNS in firewalld
      ansible.posix.firewalld:
        service: mdns
        permanent: true
        immediate: true
        state: enabled

    - name: Open Home Assistant port in firewalld
      ansible.posix.firewalld:
        port: 8123/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Open DNS in firewalld (Pi-hole)
      ansible.posix.firewalld:
        service: dns
        permanent: true
        immediate: true
        state: enabled

    - name: Open Pi-hole web UI port in firewalld
      ansible.posix.firewalld:
        port: 8081/tcp
        permanent: true
        immediate: true
        state: enabled

    # Authenticated UI only; Frigate's unauthenticated port 5000 stays closed
    - name: Open Frigate UI port in firewalld
      ansible.posix.firewalld:
        port: 8971/tcp
        permanent: true
        immediate: true
        state: enabled

    - name: Serve NTP to the LAN (cameras have no internet access)
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        regexp: "^allow "
        line: "allow {{ lan_subnet }}"
      register: chrony_conf

    - name: Restart chronyd after config change
      ansible.builtin.systemd_service:
        name: chronyd
        state: restarted
      when: chrony_conf.changed

    - name: Open NTP in firewalld
      ansible.posix.firewalld:
        service: ntp
        permanent: true
        immediate: true
        state: enabled

    - name: Let rootless containers bind ports from 53 up (Pi-hole DNS)
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "53"
        sysctl_file: /etc/sysctl.d/99-rootless-ports.conf
        state: present

    - name: Load conntrack module at boot so its sysctl applies
      ansible.builtin.copy:
        content: "nf_conntrack\n"
        dest: /etc/modules-load.d/nf_conntrack.conf
        mode: "0644"

    - name: Keep Matter UDP sessions alive through the firewall
      ansible.posix.sysctl:
        name: net.netfilter.nf_conntrack_udp_timeout_stream
        value: "3600"
        sysctl_file: /etc/sysctl.d/99-matter.conf
        state: present

    - name: Find NetworkManager connection on the default interface
      ansible.builtin.command:
        cmd: nmcli -g GENERAL.CONNECTION device show {{ ansible_default_ipv4.interface }}
      register: nm_conn
      changed_when: false

    - name: Read current DNS settings of that connection
      ansible.builtin.command:
        cmd: nmcli -g ipv4.dns,ipv4.ignore-auto-dns,ipv6.ignore-auto-dns connection show "{{ nm_conn.stdout }}"
      register: nm_dns
      changed_when: false

    - name: Pin host DNS to public resolvers
      ansible.builtin.command:
        cmd: >-
          nmcli connection modify "{{ nm_conn.stdout }}"
          ipv4.dns "{{ host_dns }}"
          ipv4.ignore-auto-dns yes
          ipv6.ignore-auto-dns yes
      when: nm_dns.stdout_lines != [host_dns, "yes", "yes"]
      register: nm_dns_changed

    - name: Re-apply connection so new DNS takes effect
      ansible.builtin.command:
        cmd: nmcli device reapply {{ ansible_default_ipv4.interface }}
      when: nm_dns_changed.changed

    - name: Enable linger so user services start at boot
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ lookup('env', 'USER') }}
        creates: /var/lib/systemd/linger/{{ lookup('env', 'USER') }}
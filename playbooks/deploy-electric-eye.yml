- name: Deploy electric-eye
  hosts: all
  become: false
  vars_files:
    - ../vars/electric-eye.yml

  tasks:
    - name: Deploy as user service
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      block:
        - name: Ensure quadlet directory exists
          ansible.builtin.file:
            path: "{{ ansible_env.HOME }}/.config/containers/systemd"
            state: directory
            mode: "0700"

        - name: Template quadlet unit
          ansible.builtin.template:
            src: ../templates/electric-eye.container.j2
            dest: "{{ ansible_env.HOME }}/.config/containers/systemd/electric-eye.container"
            mode: "0644"
          register: quadlet_changed

        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            daemon_reload: true
            scope: user
          when: quadlet_changed.changed

        - name: Pull image
          ansible.builtin.command:
            cmd: podman pull {{ electric_eye_image }}
          when: quadlet_changed.changed

        - name: Restart electric-eye
          ansible.builtin.systemd:
            name: electric-eye
            state: restarted
            scope: user
          when: quadlet_changed.changed

        - name: Ensure electric-eye is running
          ansible.builtin.systemd:
            name: electric-eye
            state: started
            scope: user
